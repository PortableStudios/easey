name: Run tests
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  test-sao:
    name: Run SAO tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run SAO tests
        run: pnpm test
  test-nextjs:
    name: Generate a Next.js project and run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate a Next.js project
        run: |
          pnpm sao . test-project --answers \
            '{ "name": "test-project", "description": "Cool project", "author": "John Smith <john@portable.com.au>", "type": "nextjs" }'

      - name: Install dependencies in the project
        working-directory: ./test-project
        run: pnpm install --frozen-lockfile

      - name: Generate a React component using Plop
        working-directory: ./test-project
        run: pnpm plop component "TestComponent" "ui" true true true

      - name: Generate a Next.js page using Plop
        working-directory: ./test-project
        run: pnpm plop page "hello-world" "HelloWorld" true

      - name: Lint, test and build the project
        working-directory: ./test-project
        run: pnpm concurrently --group --timings "pnpm:test" "pnpm:lint" "pnpm:build" "pnpm:build-storybook"

      - name: Run the Cypress tests
        working-directory: ./test-project
        run: |
          pnpm start & pnpm dlx wait-on http://localhost:3000
          pnpm cypress:run

      - name: Archive the project
        uses: actions/upload-artifact@v7
        with:
          name: project
          path: |
            test-project/**
            !**/node_modules/**
  test-sveltekit:
    name: Generate a SvelteKit project and run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate a SvelteKit project
        run: |
          pnpm sao . test-project --answers \
            '{ "name": "test-project", "description": "Cool project", "author": "John Smith <john@portable.com.au>", "type": "sveltekit" }'

      - name: Install dependencies in the project
        working-directory: ./test-project
        run: pnpm install --frozen-lockfile

      - name: Generate a Svelte component using Plop
        working-directory: ./test-project
        run: pnpm plop component "TestComponent" "ui" true true true && pnpm format

      - name: Generate a SvelteKit page using Plop
        working-directory: ./test-project
        run: pnpm plop page "hello-world" "HelloWorld" true && pnpm format

      - name: Lint, test and build the project
        working-directory: ./test-project
        run: pnpm exec playwright install --with-deps chromium && pnpm concurrently --group --timings "pnpm:check" "pnpm:lint" "pnpm:test:unit" "pnpm:test:integration" "pnpm:build" "pnpm:build-storybook"

      - name: Run the Storybook tests
        working-directory: ./test-project
        run: |
          pnpm concurrently -k -s first -n "SB,TEST" -c "magenta,blue" \
          "pnpm http-server storybook-static --port 6006 --silent" \
          "pnpm wait-on tcp:6006 && pnpm test-storybook"

      - name: Archive the project
        uses: actions/upload-artifact@v7
        with:
          name: project
          path: |
            test-project/**
            !**/node_modules/**
